{nom:"Golosa (Marc Possamai)",base:"creme",avant:"Crème, mozzarella, tomates fraîches, gorgonzola",apres:"Jambon cru"},
{nom:"Tartufa (Marc Possamai)",base:"creme",avant:"Crème de truffe, mozzarella",apres:"Roquette, coppa, crème balsamique"},
{nom:"Prosciutto e Funghi (Les Trucs à Mamy)",base:"tomate",avant:"Sauce tomate maison, mozzarella fior di latte, jambon cuit maison, champignons de Paris, origan",apres:""},
{nom:"Quattro Formaggi (Les Trucs à Mamy)",base:"creme",avant:"Sauce crème maison, mozzarella fior di latte, gorgonzola, parmesan, taleggio, huile d'olive",apres:""},
{nom:"Burrata & Rucola (Les Trucs à Mamy)",base:"tomate",avant:"Sauce tomate maison, mozzarella fior di latte, burrata crémeuse, roquette, tomates cerises, parmesan, huile d'olive extra vierge",apres:""}
];
if(typeof recueil!=="undefined")recueil.forEach(r=>{const i=pizzas.findIndex(p=>p.nom===r.nom);if(i>=0)pizzas[i]=r;else pizzas.push(r)});
let base="toutes";
const champ=document.getElementById("recherche");
const liste=document.getElementById("liste");
const compteur=document.getElementById("compteur");
function norm(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
let favoris={};
try{favoris=JSON.parse(localStorage.getItem("fafa_favoris")||"{}")}catch(e){favoris={}}
function sauverFav(){try{localStorage.setItem("fafa_favoris",JSON.stringify(favoris))}catch(e){}}
function afficherFavoris(){
const f=pizzas.filter(p=>favoris[p.nom]);
document.getElementById("compteur-fav").textContent=f.length+" favori"+(f.length>1?"s":"");
document.getElementById("liste-favoris").innerHTML=f.length?f.map(carte).join(""):'<p class="vide">Coche la case devant une pizza pour la retrouver ici.</p>';
}
let notes={};
try{notes=JSON.parse(localStorage.getItem("fafa_notes")||"{}")}catch(e){notes={}}
function sauver(){try{localStorage.setItem("fafa_notes",JSON.stringify(notes))}catch(e){}}
function etoiles(p){
const n=notes[p.nom]||0;
let h='<div class="etoiles" data-i="'+pizzas.indexOf(p)+'">';
for(let i=1;i<=5;i++)h+='<button type="button" data-n="'+i+'" class="'+(i<=n?'on':'')+'" aria-label="'+i+' sur 5">★</button>';
return h+'</div>';
}
function afficher(){
const mots=norm(champ.value).split(/[ ,]+/).filter(Boolean);
const res=pizzas.filter(p=>{
if(base!=="toutes"&&p.base!==base)return false;
const texte=norm(p.nom+" "+p.avant+" "+p.apres);
return mots.every(m=>texte.includes(m));
});
compteur.textContent=res.length+" pizza"+(res.length>1?"s":"");
liste.innerHTML=res.map(carte).join("");
}
function carte(p){
const i=pizzas.indexOf(p);
return '<div class="carte"><input type="checkbox" class="fav" data-i="'+i+'"'+(favoris[p.nom]?' checked':'')+' aria-label="Ajouter aux favoris"><h2>'+p.nom+'</h2>'+
'<span class="etiquette '+p.base+'">'+(p.base==="creme"?"Base crème":"Base tomate")+'</span>'+
'<p><b>Avant cuisson :</b> '+p.avant+'</p>'+
(p.apres?'<p class="cuisson"><b>Après cuisson :</b> '+p.apres+'</p>':'')+
etoiles(p)+'</div>';
}
document.addEventListener("click",e=>{
const b=e.target.closest(".etoiles button");
if(!b)return;
const p=pizzas[+b.parentNode.dataset.i];
const n=+b.dataset.n;
if(notes[p.nom]===n)delete notes[p.nom];else notes[p.nom]=n;
sauver();
document.querySelectorAll('.etoiles[data-i="'+b.parentNode.dataset.i+'"] button').forEach(x=>x.classList.toggle("on",+x.dataset.n<=(notes[p.nom]||0)));
});
document.addEventListener("change",e=>{
const c=e.target.closest(".fav");
if(!c)return;
const p=pizzas[+c.dataset.i];
if(c.checked)favoris[p.nom]=1;else delete favoris[p.nom];
sauverFav();
document.querySelectorAll('.fav[data-i="'+c.dataset.i+'"]').forEach(x=>{x.checked=c.checked});
afficherFavoris();
});
champ.addEventListener("input",afficher);
document.querySelectorAll(".bases button").forEach(b=>{
b.addEventListener("click",()=>{
base=b.dataset.base;
document.querySelectorAll(".bases button").forEach(x=>x.classList.remove("actif"));
b.classList.add("actif");
afficher();
});
});
afficher();
/* Coupe la musique dès qu'une autre source média se met à jouer */
const musique=document.getElementById("musique");let musiqueMiseEnPause=false,ytEnLecture=false;
function autreSourceEnLecture(){return ytEnLecture||[...document.querySelectorAll("audio,video")].some(m=>m!==musique&&!m.paused&&!m.ended)}
document.addEventListener("play",e=>{if(e.target instanceof HTMLMediaElement&&e.target!==musique)musique.pause()},true);
if(/^https?:$/.test(location.protocol)){
window.onYouTubeIframeAPIReady=()=>{document.querySelectorAll('iframe[src*="youtube.com/embed"]').forEach(f=>new YT.Player(f,{events:{onStateChange:ev=>{
if(ev.data===YT.PlayerState.PLAYING){ytEnLecture=true;musique.pause()}
else if(ev.data===YT.PlayerState.PAUSED||ev.data===YT.PlayerState.ENDED)ytEnLecture=false}}}))};
const apiYT=document.createElement("script");apiYT.src="https://www.youtube.com/iframe_api";document.head.appendChild(apiYT);
}
document.querySelectorAll(".onglets button").forEach(b=>b.addEventListener("click",()=>{
document.querySelectorAll(".onglets button").forEach(x=>x.classList.toggle("actif",x===b));
document.getElementById("vue-pizzas").hidden=b.dataset.onglet!=="pizzas";
document.getElementById("vue-favoris").hidden=b.dataset.onglet!=="favoris";
document.getElementById("vue-pate").hidden=b.dataset.onglet!=="pate";
if(b.dataset.onglet==="pate"){if(!musique.paused){musique.pause();musiqueMiseEnPause=true}}else if(musiqueMiseEnPause){musiqueMiseEnPause=false;if(!autreSourceEnLecture())musique.play().catch(()=>{})}
if(b.dataset.onglet==="favoris")afficherFavoris();
}));
function val(id){return parseFloat(String(document.getElementById(id).value).replace(",","."))||0}
function calcul(){
const base={f1:487,e1:214,l1:2.43,e2:127,s2:12,l2:1};
const k=val("c-n")*val("c-p")/(3*280);
[["f1",1],["e1",1],["l1",2],["e2",1],["s2",1],["l2",2]].forEach(([c,n])=>{
document.getElementById("r-"+c).textContent=(base[c]*k).toLocaleString("fr-FR",{maximumFractionDigits:n})+" g";
});
}
document.querySelectorAll(".calc input").forEach(i=>i.addEventListener("input",calcul));
calcul();
</script>
</body>
