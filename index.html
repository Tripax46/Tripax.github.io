<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; background: #f3e7d3; color: #4a2f1b; }
header { background: #fbf5e9; border-bottom: 4px solid #2f6b3a; text-align: center; }
header img { display: block; width: 100%; max-width: 1000px; height: auto; margin: 0 auto; }
header h1 { margin: 0; padding: 16px; font-size: 22px; color: #b3261e; }
.filtres { padding: 12px; max-width: 800px; margin: auto; }
.filtres input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #c9b08a; background: #fffdf8; color: #4a2f1b; border-radius: 8px; margin-bottom: 8px; }
.bases button { padding: 10px 16px; margin-right: 6px; border: 1px solid #2f6b3a; background: #fff; color: #2f6b3a; border-radius: 20px; font-size: 15px; cursor: pointer; }
.bases button.actif { background: #2f6b3a; color: #fff; }
#compteur { padding: 0 12px; max-width: 800px; margin: auto; color: #7a5a40; font-size: 14px; }
#liste { max-width: 800px; margin: auto; padding: 12px; }
.carte { background: #fffdf8; border: 1px solid #e6d6b8; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(90, 58, 34, .2); position: relative; padding-right: 68px; }
.carte h2 { margin: 0 0 4px; font-size: 18px; color: #5a3a22; }
.etiquette { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; margin-bottom: 6px; }
.ing { display: inline-block; background: #e6d6b8; padding: 3px 8px; border-radius: 12px; margin: 2px 4px 4px 0; font-size: 14px; color: #4a2f1b; border: 1px solid #c9b08a; }
.creme { background: #e8b830; color: #4a2f1b; }
.tomate { background: #b3261e; }
.carte p { margin: 4px 0; font-size: 15px; line-height: 1.4; }
.cuisson { color: #6b4a30; margin-top: 8px !important; }
#volume-bloc { display: flex; align-items: center; gap: 10px; max-width: 776px; margin: 8px auto 0; padding: 0 12px; color: #4a2f1b; font-size: 15px; }
#volume-bloc input { flex: 1; accent-color: #2f6b3a; }
.onglets { display: flex; gap: 8px; max-width: 800px; margin: 12px auto 0; padding: 0 12px; }
.onglets button { flex: 1; padding: 12px 4px; border: 1px solid #2f6b3a; background: #fff; color: #2f6b3a; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
.onglets button.actif { background: #2f6b3a; color: #fff; }
.pate { max-width: 800px; margin: 12px auto; padding: 14px; background: #fffdf8; border: 1px solid #e6d6b8; border-radius: 10px; }
.pate h2 { margin: 0 0 4px; color: #5a3a22; }
.pate h3 { margin: 14px 0 4px; color: #b3261e; }
.pate .source { color: #7a5a40; font-size: 14px; margin: 0 0 8px; }
.pate a { color: #2f6b3a; }
.pate li { margin-bottom: 6px; }
.pate a.lien-video { display: inline-flex; align-items: center; gap: 12px; font-size: 18px; font-weight: bold; text-decoration: none; }
.pate iframe { display: block; max-width: 100%; height: auto; aspect-ratio: 16/9; border: 0; }
.calc .ligne { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
.calc input { width: 80px; padding: 8px; font-size: 16px; border: 1px solid #c9b08a; border-radius: 6px; background: #fffdf8; color: #4a2f1b; text-align: right; }
.calc table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.calc th { text-align: left; color: #7a5a40; font-size: 14px; padding: 4px; }
.calc td { padding: 6px 4px; border-top: 1px solid #e6d6b8; }
.calc .phase td { background: #f3e7d3; font-weight: bold; color: #5a3a22; }
.calc td b { color: #b3261e; font-size: 18px; }
.calc td:nth-child(2) { text-align: right; }
.fav { -webkit-appearance: none; appearance: none; position: absolute; top: 50%; right: 14px; transform: translateY(-50%); width: 40px; height: 40px; margin: 0; border: 3px solid #6b3f1d; border-radius: 6px; background: #fffdf8; cursor: pointer; }
.fav:checked { background: #6b3f1d; }
@media(min-width:1000px) { .carte { padding-right: 14px; } .fav { right: -64px; } }
.vide { color: #7a5a40; padding: 12px; }
#compteur-fav { padding: 12px 12px 0; max-width: 800px; margin: auto; color: #7a5a40; font-size: 14px; }

const toutesPizzas = [...recueil142, ...pizzasExistantes];
const pizzas = [];
const vus = new Set();
// Fonction de normalisation incluant le traitement des ligatures
function norm(t){return t.toLowerCase().replace(/œ/g,"oe").normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

toutesPizzas.forEach(p => {
    // Élimination des doublons, ignorant les accents, majuscules et espaces superflus
    const nomNorm = norm(p.nom).replace(/\s+/g, ' ').trim();
    if(!vus.has(nomNorm)) {
        vus.add(nomNorm);
        pizzas.push(p);
    }
});

let base="toutes";
const champ=document.getElementById("recherche");
const liste=document.getElementById("liste");
const compteur=document.getElementById("compteur");

let favoris={};
try{favoris=JSON.parse(localStorage.getItem("fafa_favoris")||"{}")}catch(e){favoris={}}
function sauverFav(){try{localStorage.setItem("fafa_favoris",JSON.stringify(favoris))}catch(e){}}

function afficherFavoris(){
    const f=pizzas.filter(p=>favoris[p.nom]);
    document.getElementById("compteur-fav").textContent=f.length+" favori"+(f.length>1?"s":"");
    document.getElementById("liste-favoris").innerHTML=f.length?f.map(carte).join(""):'<p class="vide">Coche la case devant une pizza pour la retrouver ici.</p>';
}

let notes={};
try{notes=JSON.parse(localStorage.getItem("fafa_notes")||"{}")}catch(e){notes={}}
function sauver(){try{localStorage.setItem("fafa_notes",JSON.stringify(notes))}catch(e){}}

function etoiles(p){
    const n=notes[p.nom]||0;
    let h='<div class="etoiles" data-i="'+pizzas.indexOf(p)+'">';
    for(let i=1;i<=5;i++)h+='<button type="button" data-n="'+i+'" class="'+(i<=n?'on':'')+'" aria-label="'+i+' sur 5">★</button>';
    return h+'</div>';
}

function formaterIngredients(texte) {
    if (!texte) return "";
    if (texte.match(/composition( complète| détaillée)? non publiée/i) || texte.match(/tous les ingrédients/i)) {
        return `<em>${texte}</em>`;
    }
    // Séparer les ingrédients et générer des étiquettes individuelles
    return texte.split(/[,;](?![^(]*\))/).map(i => {
        const ing = i.trim();
        return ing ? `<span class="ing">${ing.charAt(0).toUpperCase() + ing.slice(1)}</span>` : '';
    }).join(' ');
}

function afficher(){
    const mots=norm(champ.value).split(/[ ,]+/).filter(Boolean);
    const res=pizzas.filter(p=>{
        if(base!=="toutes"&&p.base!==base)return false;
        const texte=norm(p.nom+" "+p.avant+" "+p.apres);
        // Recherche stricte par ingrédient via les limites de mot \b
        return mots.every(m => new RegExp('\\b' + m).test(texte));
    });
    compteur.textContent=res.length+" pizza"+(res.length>1?"s":"");
    liste.innerHTML=res.map(carte).join("");
}

function carte(p){
    const i=pizzas.indexOf(p);
    return '<div class="carte"><input type="checkbox" class="fav" data-i="'+i+'"'+(favoris[p.nom]?' checked':'')+' aria-label="Ajouter aux favoris"><h2>'+p.nom+'</h2>'+
    '<span class="etiquette '+p.base+'">'+(p.base==="creme"?"Base crème":"Base tomate")+'</span>'+
    '<p><b>Avant cuisson :</b><br> '+formaterIngredients(p.avant)+'</p>'+
    (p.apres?'<p class="cuisson"><b>Après cuisson :</b><br> '+formaterIngredients(p.apres)+'</p>':'')+
    etoiles(p)+'</div>';
}

document.addEventListener("click",e=>{
    const b=e.target.closest(".etoiles button");
    if(!b)return;
    const p=pizzas[+b.parentNode.dataset.i];
    const n=+b.dataset.n;
    if(notes[p.nom]===n)delete notes[p.nom];else notes[p.nom]=n;
    sauver();
    document.querySelectorAll('.etoiles[data-i="'+b.parentNode.dataset.i+'"] button').forEach(x=>x.classList.toggle("on",+x.dataset.n<=(notes[p.nom]||0)));
});

document.addEventListener("change",e=>{
    const c=e.target.closest(".fav");
    if(!c)return;
    const p=pizzas[+c.dataset.i];
    if(c.checked)favoris[p.nom]=1;else delete favoris[p.nom];
    sauverFav();
    document.querySelectorAll('.fav[data-i="'+c.dataset.i+'"]').forEach(x=>{x.checked=c.checked});
    afficherFavoris();
});

champ.addEventListener("input",afficher);

        document.querySelectorAll(".bases button").forEach(x=>x.classList.remove("actif"));
        b.classList.add("actif");
        afficher();
    });
});

/* Musique : volume réglable, coupée automatiquement quand une autre source média joue */
const musique=document.getElementById("musique"),curseur=document.getElementById("volume");
const autres=new Set();
let voulue=true;
try{const v=parseFloat(localStorage.getItem("fafa_volume"));if(!isNaN(v)){curseur.value=v}}catch(e){}
musique.volume=parseFloat(curseur.value);
curseur.addEventListener("input",()=>{musique.volume=parseFloat(curseur.value);try{localStorage.setItem("fafa_volume",curseur.value)}catch(e){}});

function majMusique(){
    if(autres.size){musique.pause()}
    else if(voulue){musique.play().catch(()=>{})}
}

["play","playing"].forEach(t=>document.addEventListener(t,e=>{if(e.target instanceof HTMLMediaElement&&e.target!==musique){autres.add(e.target);majMusique()}},true));
["pause","ended"].forEach(t=>document.addEventListener(t,e=>{if(e.target instanceof HTMLMediaElement&&e.target!==musique){autres.delete(e.target);majMusique()}},true));

if(/^https?:$/.test(location.protocol)){
    window.onYouTubeIframeAPIReady=()=>{document.querySelectorAll('iframe[src*="youtube.com/embed"]').forEach(f=>new YT.Player(f,{events:{onStateChange:ev=>{
        const S=YT.PlayerState;
        if(ev.data===S.PLAYING||ev.data===S.BUFFERING)autres.add(f);
        else if(ev.data===S.PAUSED||ev.data===S.ENDED||ev.data===S.CUED)autres.delete(f);
        majMusique()}}}))};
    const apiYT=document.createElement("script");apiYT.src="https://www.youtube.com/iframe_api";document.head.appendChild(apiYT);
}

function demarrer(){majMusique();if(!musique.paused||autres.size)["pointerdown","keydown","touchstart"].forEach(t=>document.removeEventListener(t,demarrer))}
["pointerdown","keydown","touchstart"].forEach(t=>document.addEventListener(t,demarrer));
musique.play().catch(()=>{});

function pauseVideos(){document.querySelectorAll('iframe[src*="youtube.com/embed"]').forEach(f=>{try{f.contentWindow.postMessage(JSON.stringify({event:"command",func:"pauseVideo",args:[]}),"https://www.youtube.com")}catch(e){}})}

    document.getElementById("vue-pizzas").hidden=b.dataset.onglet!=="pizzas";
    document.getElementById("vue-favoris").hidden=b.dataset.onglet!=="favoris";
    document.getElementById("vue-pate").hidden=b.dataset.onglet!=="pate";
    if(b.dataset.onglet==="favoris")afficherFavoris();
}));

function val(id){return parseFloat(String(document.getElementById(id).value).replace(",","."))||0}
function calcul(){
    const base={f1:487,e1:214,l1:2.43,e2:127,s2:12,l2:1};
    const k=val("c-n")*val("c-p")/(3*280);
    [["f1",1],["e1",1],["l1",2],["e2",1],["s2",1],["l2",2]].forEach(([c,n])=>{
        document.getElementById("r-"+c).textContent=(base[c]*k).toLocaleString("fr-FR",{maximumFractionDigits:n})+" g";
    });
}
document.querySelectorAll(".calc input").forEach(i=>i.addEventListener("input",calcul));
calcul();
</script>
